[project]
name = "qafila"
version = "1.0.0"
description = "Logistics agent orchestration platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "W", "PIE", "PT"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
