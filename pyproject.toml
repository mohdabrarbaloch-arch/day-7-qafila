[project]
name = "qafila"
version = "1.0.0"
description = "Logistics AI agent orchestration platform — dispatch, routing, inventory and demand agents."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the required idiom

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
